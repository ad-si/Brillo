name: Windows CI
on:
  - push
  - pull_request
  - merge_group
jobs:
  windows:
    name: Windows - Stack
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          release: false
          install: >-
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-libwebp

      - name: Configure environment
        shell: bash
        run: |
          echo 'C:\msys64\ucrt64\bin' >> "$GITHUB_PATH"
          cat >> stack.yaml <<'EOF'

          skip-msys: true
          extra-include-dirs:
            - C:\msys64\ucrt64\include
            - C:\msys64\ucrt64\include\freetype2
          extra-lib-dirs:
            - C:\msys64\ucrt64\lib
          EOF

      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: C:\sr
          key: ${{ runner.os }}-ucrt64-stack-${{ hashFiles('stack.yaml', 'stack.yaml.lock') }}
          restore-keys: ${{ runner.os }}-ucrt64-stack-

      - name: Install dependencies
        run: stack build --only-dependencies --test --no-run-tests

      - name: Build
        run: stack build --test --no-run-tests

      - name: Test
        run: stack test

      - name: Save cache
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: C:\sr
          key: ${{ runner.os }}-ucrt64-stack-${{ hashFiles('stack.yaml', 'stack.yaml.lock') }}
